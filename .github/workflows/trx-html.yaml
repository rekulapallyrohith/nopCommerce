name: .trt to HTML
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
            languages: csharp
      - name: Build .NET
        run: dotnet build --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj
      - name: Test
        run: dotnet test --logger "trx;LogFileName=test-results.trx" src/Tests/Nop.Tests/Nop.Tests.csproj --results-directory ./TestResults
      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools

      - name: Add ReportGenerator to PATH
        run: echo "./.tools" >> $GITHUB_PATH
      - name: Convert TRX to HTML Report
        run: |
          reportgenerator \
            -reports:./TestResults/*.trx \
            -targetdir:./TestResults/html \
            -reporttypes:Html
      - name: Set artifact name variables
        id: vars
        run: |
          echo "REPO_NAME=${{github.event.repository.name}}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{github.run_number}}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{github.event.repository.name}}-${{github.run_number}}" >> $GITHUB_ENV
      - name: Zip Test Results
        run: |
          zip -r "${{env.ARTIFACT_NAME}}.zip" ./TestResults
      - name: Upload Zipped Test Results
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: ${{env.ARTIFACT_NAME}}.zip
      - name: Publish .NET Package
        run: dotnet publish --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj -o published/
