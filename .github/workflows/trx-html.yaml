name: .trt to HTML
on:
    push:
        branches:
            - develop
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-
            - name: Build .NET
              run: dotnet build --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj
            - name: Test
              run: dotnet test --logger "trx;LogFileName=test-results.trx" src/Tests/Nop.Tests/Nop.Tests.csproj --results-directory ./TestResults
            - name: Install ReportGenerator
              run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools

            - name: Add ReportGenerator to PATH
              run: echo "./.tools" >> $GITHUB_PATH
            - name: Convert TRX to HTML Report
              run: |
                  reportgenerator \
                    -reports:./TestResults/*.trx \
                    -targetdir:./TestResults/html \
                    -reporttypes:Html
            - name: Zip Test Results
              run: |
                  zip -r test-results.zip ./TestResults
            - name: Upload Zipped Test Results
              uses: actions/upload-artifact@v4
              with:
                  name: zipped-test-results
                  path: test-results.zip
            - name: Publish .NET Package
              run: dotnet publish --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj -o published/