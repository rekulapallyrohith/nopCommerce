name: .trt to HTML
on:
    push:
        branches:
            - develop
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                language: [csharp]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Cache NuGet packages
              uses: actions/cache@v4
              with:
                  path: ~/.nuget/packages
                  key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-nuget-
            - name: Cache .NET build output
              uses: actions/cache@v4
              with:
                  path: |
                      **/bin
                      **/obj
                  key: ${{ runner.os }}-dotnet-build-${{ hashFiles('**/*.csproj') }}
                  restore-keys: |
                      ${{ runner.os }}-dotnet-build-
            # - name: Initialize CodeQL
            #   uses: github/codeql-action/init@v3
            #   with:
            #       languages: ${{matrix.language}}
            - name: Build .NET
              run: dotnet build --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj
            # - name: Perform CodeQL Analysis
            #   uses: github/codeql-action/analyze@v3
            - name: Test with JUnit Output (MSBuild Properties)
              run: |
                dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj \
                  /p:VSTestResultsDirectory=./TestResults \
                  /p:Logger="nunitxml;LogFileName=test-results.xml"

            - name: Set artifact name variables
              id: vars
              run: |
                  echo "REPO_NAME=${{github.event.repository.name}}" >> $GITHUB_ENV
                  echo "BUILD_NUMBER=${{github.run_number}}" >> $GITHUB_ENV
                  echo "ARTIFACT_NAME=${{github.event.repository.name}}-${{github.run_number}}" >> $GITHUB_ENV
            - name: Zip Test Results (Robust Path)
              # Create an empty zip file using the dot '.', then explicitly include the directory contents
              # This often resolves CI environment path lookup issues
              run: |
                  zip -r "${{env.ARTIFACT_NAME}}.zip" . -i "TestResults/*"
            - name: Publish Test Results to GitHub UI
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                  files: ./TestResults/test-results.xml  # <-- Corrected path

            - name: Publish .NET Package
              run: dotnet publish --configuration Release src/Presentation/Nop.Web/Nop.Web.csproj -o published/
